[package]
name = "rustmq"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "Apache-2.0"
description = "A high-performance MQTT broker inspired by EMQX architecture"

[dependencies]
anyhow = "=1.0.97"
arc-swap = "=1.9.3"
argon2 = "=0.5.3"
axum = { version = "=0.8.1", features = ["ws"] }
base64 = "=0.22.1"
bytes = "=1.10.1"
dashmap = "=6.1.0"
ipnet = "=2.12.2"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
redb = "=2.6.3"
regex = "=1.13.1"
ring = "=0.17.14"
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
subtle = "=2.6.1"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "=1.44.1", features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "=0.8.23"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }

[dev-dependencies]
rcgen = "=0.13.2"
tempfile = "=3.19.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
